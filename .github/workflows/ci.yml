name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 仓库约定不提交 lockfile（.gitignore），故用普通 install
      - name: Install dependencies
        run: yarn install --non-interactive
      - name: Lint (ESLint, errors block)
        run: yarn lint
      - name: Unit & a11y audits (vitest + axe)
        run: yarn test
      - name: Build library + type declarations
        run: yarn build
